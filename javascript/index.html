
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #image {
            width: 600px;
            height: 350px;
            margin: 20px auto;
            border: 2px solid black;
            background-color: #8e8e8e;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
        }

        .gallery img {
            width: 180px;
            height: 120px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
             alt="Beautiful landscape"
             onmouseover="upDate(this)"
             onmouseleave="undo()">

        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
             alt="Sunrise over the mountains"
             onmouseover="upDate(this)"
             onmouseleave="undo()">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
             alt="Mountain lake"
             onmouseover="upDate(this)"
             onmouseleave="undo()">
    </div>

    <script>
        function upDate(previewPic) {
            console.log("Mouse over image");
            console.log("Alt:", previewPic.alt);
            console.log("Source:", previewPic.src);

            document.getElementById("image").innerHTML = previewPic.alt;

            document.getElementById("image").style.backgroundImage =
                "url('" + previewPic.src + "')";
        }

        function undo() {
            document.getElementById("image").style.backgroundImage = "url('')";

            document.getElementById("image").innerHTML =
                "Hover over an image below to display here.";
        }
    </script>
</body>
</html>
